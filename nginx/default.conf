server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- static frontend -----------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /map.manifest.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # --- editor API ---------------------------------------------------------
    location /api/ {
        proxy_pass http://editor:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 10m;
        add_header Cache-Control "no-store";
    }

    location = /editor {
        try_files /editor.html =404;
    }

    location = /editor/ {
        try_files /editor.html =404;
    }

    # --- generated sprite sheets (mounted from ./data) -----------------------
    location /sprites/ {
        alias /data/sprites/;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # --- TileServer GL -------------------------------------------------------
    # Styles are served as static JSON so editor saves take effect on reload
    # without restarting TileServer GL. Keep the old /styles/<id>/style.json
    # URL working for Maputnik and existing clients.
    location ~ ^/styles/([A-Za-z0-9_-]+)/style\.json$ {
        alias /srv/styles/$1.json;
        add_header Cache-Control "no-store";
    }

    location /styles/ {
        alias /srv/styles/;
        add_header Cache-Control "no-store";
    }

    location ^~ /fonts/ {
        proxy_pass http://tileserver:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ^~ /data/ {
        proxy_pass http://tileserver:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /styles.json {
        proxy_pass http://tileserver:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location = /data.json {
        proxy_pass http://tileserver:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location = /health {
        proxy_pass http://tileserver:8080;
        proxy_set_header Host $host;
        access_log off;
    }
}
